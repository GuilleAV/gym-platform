<main class="contenedor">
  @switch (sesion.estado()) {
    @case ('cargando') {
      <p class="secundario">Cargando…</p>
    }
    @case ('gimnasio-desconocido') {
      <h1>Gimnasio no encontrado</h1>
      <p class="secundario">Este dominio no corresponde a ningún gimnasio registrado.</p>
    }
    @default {
      <header>
        <h1>{{ sesion.gimnasio()?.nombre }}</h1>
        @if (sesion.bienvenida()) {
          <p class="bienvenida">{{ sesion.bienvenida() }}</p>
        }
      </header>
      <router-outlet />
    }
  }
</main>
