# Entorno de DESARROLLO local. No usar tal cual en producción.
#
# Uso (desde la raíz del repo):
#   cp .env.example .env          # y poner una clave real
#   docker compose -f infra/docker-compose.yml --env-file .env up -d
#
# La versión de la imagen está fijada en ADR-0001 y debe coincidir con
# backend/pom.xml (propiedad mysql.image). VersionesStackTest lo verifica.

name: gimnasio

services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      # ":?" hace que docker compose se niegue a arrancar si falta la variable.
      # Así es imposible levantar la base con una contraseña vacía o por defecto.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definí MYSQL_ROOT_PASSWORD en .env (ver .env.example)}
      # Claves de los usuarios de la plataforma (ADR-0002 §3). Las usa infra/mysql/init/01-plataforma.sh.
      GP_APP_DB_PASSWORD: ${GP_APP_DB_PASSWORD:?Definí GP_APP_DB_PASSWORD en .env (ver .env.example)}
      GP_APROVISIONADOR_DB_PASSWORD: ${GP_APROVISIONADOR_DB_PASSWORD:?Definí GP_APROVISIONADOR_DB_PASSWORD en .env (ver .env.example)}
    command:
      # Todo en UTC dentro de la base; la zona horaria de cada gimnasio se aplica
      # en la aplicación (revisión técnica, punto 3.9).
      - --default-time-zone=+00:00
    ports:
      # Formato "IP:puerto_en_tu_PC:puerto_en_el_contenedor".
      # - Puerto en tu PC: 3307 por defecto (configurable con MYSQL_PORT en .env), para
      #   no chocar con otro MySQL que ya use el 3306. Dentro del contenedor sigue siendo 3306.
      # - SEGURIDAD: se publica solo en 127.0.0.1. Sin esa IP, la base quedaría accesible
      #   desde cualquier máquina de la red (o de Internet, en un VPS).
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Scripts que MySQL corre la PRIMERA vez (volumen vacío): crean gym_platform y sus usuarios.
      # ":ro" = solo lectura: el contenedor no puede modificar los scripts del repo.
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # La clave va por MYSQL_PWD y no como "-p<clave>", para que no aparezca
      # en la lista de procesos del contenedor.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    # Servidor de correo FALSO para desarrollo: atrapa todos los mails que manda la app
    # (invitaciones, avisos de vencimiento) y los muestra en http://localhost:8025.
    # Ningún mail de prueba llega a una persona real.
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db      # los mails sobreviven a un reinicio del contenedor
      MP_MAX_MESSAGES: 5000              # guarda los últimos 5000 y borra los más viejos
      MP_SMTP_AUTH_ACCEPT_ANY: 1         # acepta cualquier usuario/clave SMTP (solo desarrollo)
      MP_SMTP_AUTH_ALLOW_INSECURE: 1     # permite SMTP sin TLS (solo desarrollo, solo localhost)
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"   # la app manda los mails acá (SMTP)
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"     # bandeja web para leerlos
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  mailpit-data:
