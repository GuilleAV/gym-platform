# Configuración base, común a todos los entornos.
# NUNCA poner secretos acá: este archivo se versiona en Git.
# Los secretos llegan por variables de entorno (ver docs/adr, ADR-0002 próximamente).
spring:
  application:
    name: gimnasio

  # --- Catálogo de la plataforma (gym_platform) ---------------------------------------
  # La app lo lee con gp_app: solo datos, sin permisos para crear o borrar tablas (ADR-0002 §3).
  # Las bases de cada gimnasio NO se configuran acá: se resuelven en runtime desde el catálogo (paso 0.4).
  datasource:
    # Servidor y parámetros: ver gym.bd más abajo (se comparten con las bases de los gimnasios).
    url: jdbc:mysql://${gym.bd.host}:${gym.bd.puerto}/gym_platform?${gym.bd.parametros}
    username: gp_app
    password: ${GP_APP_DB_PASSWORD}
    hikari:
      pool-name: catalogo
      maximum-pool-size: 5          # ADR-0002 §4
      connection-timeout: 5000      # ms: si la base no responde, fallar rápido y no colgar requests

  # --- Migraciones del catálogo -------------------------------------------------------
  # Flyway usa OTRO usuario (gp_aprovisionador), con permisos de estructura. Al definir
  # spring.flyway.user, Spring Boot le arma a Flyway su propia conexión, separada del pool de la app.
  # Desarrollo: migra al arrancar. Producción: GYM_MIGRAR_AL_INICIAR=false y las migraciones
  # corren como un paso aparte del deploy, para que la app web nunca tenga esta credencial.
  flyway:
    enabled: ${GYM_MIGRAR_AL_INICIAR:true}
    user: gp_aprovisionador
    password: ${GP_APROVISIONADOR_DB_PASSWORD:}
    locations: classpath:db/plataforma
    # Si alguien editó una migración ya aplicada, Flyway detecta el checksum distinto y NO arranca.
    validate-on-migrate: true
  mail:
    # En desarrollo: Mailpit (infra/docker-compose.yml). En producción: el SMTP real, por variables de entorno.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    default-encoding: UTF-8      # acentos y ñ correctos en asunto y cuerpo
    properties:
      # Timeouts en milisegundos: si el servidor de correo no responde, no bloquear la aplicación.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

gym:
  # --- Servidor MySQL (visto desde la app) ---------------------------------------------
  bd:
    host: ${GYM_DB_HOST:127.0.0.1}
    puerto: ${GYM_DB_PORT:3307}
    # sslMode=PREFERRED: usa TLS si el servidor lo ofrece (MySQL 8.4 lo trae activado).
    # En producción: GYM_DB_PARAMS=sslMode=VERIFY_IDENTITY (TLS obligatorio con certificado verificado).
    parametros: ${GYM_DB_PARAMS:sslMode=PREFERRED&allowPublicKeyRetrieval=true}

  # --- Secretos (ADR-0002 §2) -----------------------------------------------------------
  secretos:
    # 32 bytes aleatorios en Base64. Cifra las claves de las bases de los gimnasios.
    # Si se pierde, se pierden esas claves (no los datos): respaldarla APARTE de la base.
    clave-maestra: ${GYM_CLAVE_MAESTRA:}
    version-clave: 1

  # --- Alta de gimnasios (PLA-03) -------------------------------------------------------
  aprovisionamiento:
    usuario: gp_aprovisionador
    password: ${GP_APROVISIONADOR_DB_PASSWORD:}
    # gimnasios: se listan en application-demo.yml (perfil "demo").

  monitoreo:
    disco:
      habilitado: ${GYM_MONITOREO_DISCO_HABILITADO:true}
      # Carpetas a vigilar, separadas por coma. En producción: el volumen de archivos (ADR-0004)
      # y, si MySQL está en otro disco, también su carpeta de datos.
      rutas: ${GYM_MEDIA_PATH:./data/media}
      umbral-porcentaje: 85        # avisar al llegar al 85 % de uso
      histeresis-puntos: 5         # "normalizado" recién por debajo del 80 %
      recordatorio: PT24H          # mientras siga arriba, recordar una vez por día
      intervalo: PT15M             # revisar cada 15 minutos
      demora-inicial: PT1M         # primera revisión, 1 minuto después de arrancar
      email-destino: ${GYM_ALERTAS_EMAIL:}   # vacío = solo queda en el log
